<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Returns &amp; Replacement Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Kantumruy+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F5F7; --surface:#FFFFFF; --rule:#E2E5EA; --rule2:#CBD1DA; --hover:#F8F9FB;
  --ink:#1A2433; --ink2:#465263; --ink3:#687385; --ink4:#9AA3B2; --navy:#1B2B44;
  --r:8px; --font:'IBM Plex Sans','Kantumruy Pro','Khmer UI','Khmer OS System','Noto Sans Khmer',system-ui,sans-serif;
}
/* tones: every stage / status owns one */
.t-ng  {--c:#B42318;--bg:#FEF3F2;--bd:#FCD3CD}
.t-sup {--c:#B54708;--bg:#FFF7EA;--bd:#FCDDA8}
.t-bl  {--c:#175CD3;--bg:#EFF5FF;--bd:#C2D8FA}
.t-tl  {--c:#0B7480;--bg:#EDFAFB;--bd:#B0E3E7}
.t-good{--c:#067647;--bg:#ECFBF2;--bd:#A9E9C3}
.t-cn  {--c:#5925DC;--bg:#F5F2FF;--bd:#D8CEFB}
.t-ink {--c:#1B2B44;--bg:#F1F3F6;--bd:#D5DAE2}
.t-rj  {--c:#9E165F;--bg:#FDF1F7;--bd:#F5C6DE}
.t-disp{--c:#475467;--bg:#EEF0F3;--bd:#D0D5DD}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{overflow-anchor:none;margin:0;font-family:var(--font);font-size:14px;line-height:1.45;color:var(--ink);background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.r,.big{font-variant-numeric:tabular-nums}
.kh{font-family:'Kantumruy Pro','Khmer UI','Khmer OS System','Noto Sans Khmer',sans-serif;font-weight:400}
:focus-visible{outline:2px solid #4B7BEC;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- header ---------- */
.hdr{background:var(--surface);border-bottom:1px solid var(--rule);position:sticky;top:calc(var(--hdrTopH,62px) * -1);z-index:30}
.hdr-top{display:flex;align-items:center;gap:14px;padding:12px 24px;max-width:1400px;margin:0 auto}
.mark{width:38px;height:38px;border-radius:9px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:.02em;flex:none}
.co b{display:block;font-size:15px;font-weight:600;line-height:1.2}
.co span{font-size:12.5px;color:var(--ink3)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.today{color:var(--ink3);font-size:13px;margin-right:6px}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border:1px solid var(--rule);border-radius:17px;background:#fff;cursor:pointer;font-size:13px;color:var(--ink2)}
.chip:hover{background:var(--hover)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink4);flex:none}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--rule);border-radius:8px;background:#fff;cursor:pointer;color:var(--ink2)}
.icon-btn:hover{background:var(--hover)}
.icon-btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ---------- stage track (the navigation IS the flow) ---------- */
.track-w{border-top:1px solid var(--rule);background:#FAFBFC}
.track{display:flex;align-items:stretch;gap:12px;padding:10px 24px;max-width:1400px;margin:0 auto;overflow-x:auto;scrollbar-width:thin}
.ov{display:flex;align-items:center;gap:8px;padding:0 16px;border-radius:8px;border:1px solid var(--rule);background:#fff;cursor:pointer;font-weight:500;color:var(--ink2);white-space:nowrap}
.ov:hover{background:var(--hover)}
.ov.on{background:var(--navy);border-color:var(--navy);color:#fff}
.stages{display:flex;flex:1;min-width:640px}
.seg{flex:1;display:flex;align-items:center;gap:12px;padding:9px 30px 9px 30px;margin-left:-10px;background:var(--bg);color:var(--c);cursor:pointer;border:0;text-align:left;
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%,16px 50%);transition:background .15s,color .15s}
.seg:first-child{margin-left:0;padding-left:16px;border-radius:8px 0 0 8px;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%)}
.seg:hover{filter:brightness(.97)}
.seg.on{background:var(--c);color:#fff}
.seg .no{width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.seg .nm{font-weight:600;line-height:1.15}
.seg .nm small{display:block;font-weight:400;font-size:12px;opacity:.85}
.seg .ct{margin-left:auto;text-align:right;line-height:1.1}
.seg .ct b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.seg .ct small{display:block;font-size:11.5px;opacity:.85;white-space:nowrap}

/* ---------- page ---------- */
main{max-width:1400px;margin:0 auto;padding:24px 24px 40px}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:23px;line-height:1.2;font-weight:600;margin:0;letter-spacing:-.01em}
.ph h1 .kh{font-size:15px;color:var(--ink3);margin-left:10px}
.ph p{margin:5px 0 0;color:var(--ink3);max-width:70ch}
.ph .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);margin-bottom:20px}
.panel.edge{border-top:3px solid var(--c)}
.p-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:13px 18px;border-bottom:1px solid var(--rule)}
.p-h h2{font-size:15px;font-weight:600;margin:0}
.p-h h2 .kh{font-size:13px;color:var(--ink3);margin-left:8px;font-weight:400}
.p-h .note{color:var(--ink3);font-size:13px}
.p-h .act{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.p-b{padding:18px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 18px;border-bottom:1px solid var(--rule);background:#FCFCFD}

/* ---------- form ---------- */
.fg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px 14px;align-items:end}
.fg .s2{grid-column:span 2}.fg .s3{grid-column:span 3}.fg .s6{grid-column:1/-1}
@media(max-width:900px){.fg{grid-template-columns:repeat(2,minmax(0,1fr))}.fg .s2,.fg .s3{grid-column:span 2}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:500;color:var(--ink2)}
input,select,textarea{height:38px;padding:0 11px;border:1px solid var(--rule2);border-radius:7px;background:#fff;font-size:14px;min-width:0;width:100%}
textarea{height:auto;padding:8px 11px}
input[type=checkbox]{width:16px;height:16px;padding:0;accent-color:var(--navy)}
input:focus,select:focus,textarea:focus{outline:none;border-color:#4B7BEC;box-shadow:0 0 0 3px #4B7BEC26}
.search{position:relative;flex:1;min-width:220px}
.search svg{position:absolute;left:11px;top:11px;color:var(--ink4)}
.search input{padding-left:34px}
.tools select{width:auto;min-width:150px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border:1px solid var(--rule2);border-radius:7px;background:#fff;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:6px}
.btn.solid{background:var(--c);border-color:var(--c);color:#fff}
.btn.solid:hover{filter:brightness(1.08);background:var(--c)}
.btn.soft{background:var(--bg);border-color:var(--bd);color:var(--c)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink3)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}

/* ---------- table ---------- */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-weight:500;color:var(--ink3);font-size:12.5px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule);background:#FAFBFC;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #EEF0F3;vertical-align:middle}
tbody tr:hover td{background:var(--hover)}
th.r,td.r{text-align:right}
th:first-child,td:first-child{padding-left:18px}
th:last-child,td:last-child{padding-right:18px}
tfoot td{font-weight:600;background:#FAFBFC;border-bottom:0;border-top:1px solid var(--rule)}
.sub{font-size:12.5px;color:var(--ink3)}
.prod b{font-weight:500;display:block}
.nowrap{white-space:nowrap}
.warn{color:#B42318;font-weight:500}
tr.grp td{background:#FAFBFC;border-bottom:1px solid var(--rule);padding-top:12px;padding-bottom:12px}
tr.grp:hover td{background:#FAFBFC}
.grp-h{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.grp-h .meta{color:var(--ink3);font-size:13px}

.req{font-weight:400;font-size:11px;color:#B42318;margin-left:4px}
.imp-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.imp-sum div{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;background:#FAFBFC}
.imp-sum b{display:block;font-size:20px;font-weight:600}
.imp-sum span{font-size:12px;color:var(--ink3)}
.imp-sum .bad{border-color:#FCD3CD;background:#FEF3F2}.imp-sum .bad b{color:#B42318}
/* floating search: pops up when the page's own search box scrolls away */
.fs{position:fixed;top:calc(var(--navH,0px) + 10px);right:max(34px,calc((100vw - 1400px) / 2 + 34px));z-index:25;display:flex;align-items:center;justify-content:flex-end;gap:10px;pointer-events:none}
.fs>*{pointer-events:auto}
.fs-ret{height:52px;display:flex;align-items:center;gap:9px;padding:0 10px 0 18px;border:0;border-radius:999px;background:#B54708;color:#fff;font-size:14.5px;font-weight:600;white-space:nowrap;cursor:pointer;
  box-shadow:0 2px 4px rgba(16,24,40,.08),0 12px 28px -10px rgba(181,71,8,.55);opacity:0;transform:scale(.4);transform-origin:right center;visibility:hidden;
  transition:transform .2s cubic-bezier(.3,1.35,.6,1),opacity .15s,visibility 0s .2s}
.fs.ret .fs-ret{opacity:1;transform:none;visibility:visible;transition:transform .2s cubic-bezier(.3,1.35,.6,1),opacity .15s,visibility 0s}
.fs-ret:hover{background:#9C3D06}
.fs-n{min-width:30px;height:30px;padding:0 8px;border-radius:15px;background:#fff;color:#B54708;display:grid;place-items:center;font-size:13.5px;font-variant-numeric:tabular-nums}
.fs-ret.off{background:#98A2B3;box-shadow:0 2px 4px rgba(16,24,40,.08),0 12px 28px -10px rgba(16,24,40,.35)}
.fs-ret.off .fs-n{color:#475467}
.fs.open .fs-ret{display:none}
.fs-btn{position:relative;width:52px;height:52px;border-radius:50%;border:1px solid var(--rule);background:#fff;color:var(--ink);display:grid;place-items:center;cursor:pointer;
  box-shadow:0 2px 4px rgba(16,24,40,.06),0 12px 28px -10px rgba(16,24,40,.32);opacity:0;transform:scale(.4);visibility:hidden;
  transition:transform .2s cubic-bezier(.3,1.35,.6,1),opacity .15s,visibility 0s .2s}
.fs.show .fs-btn{opacity:1;transform:scale(1);visibility:visible;transition:transform .2s cubic-bezier(.3,1.35,.6,1),opacity .15s,visibility 0s}
.fs-btn:hover{background:#F7F8FA}
.fs-dot{position:absolute;top:10px;right:11px;width:10px;height:10px;border-radius:50%;background:var(--c,var(--navy));border:2px solid #fff;display:none}
.fs.has .fs-dot{display:block}
.fs-box{display:none;align-items:center;gap:10px;height:52px;width:min(440px,calc(100vw - 48px));padding:0 6px 0 18px;background:#fff;border:1.5px solid var(--c,var(--navy));border-radius:999px;
  color:var(--ink3);box-shadow:0 2px 4px rgba(16,24,40,.06),0 14px 32px -10px rgba(16,24,40,.32);transform-origin:right center;animation:fsIn .18s ease-out}
.fs.open .fs-btn{display:none}
.fs.open .fs-box{display:flex}
.fs-box input{flex:1;height:100%;border:0;padding:0;background:transparent;font-size:15px;color:var(--ink)}
.fs-box input:focus{box-shadow:none}
.fs-x{width:40px;height:40px;flex:none;border:0;border-radius:50%;background:transparent;color:var(--ink3);display:grid;place-items:center;cursor:pointer}
.fs-x:hover{background:var(--hover);color:var(--ink)}
@keyframes fsIn{from{opacity:0;transform:scaleX(.25)}to{opacity:1;transform:none}}
/* supplier page tabs: rounded pill bar, selected tab is a filled pill with icon */
.subbar{position:sticky;top:var(--navH,0px);z-index:20;background:var(--paper);padding:10px 0 12px;margin:-10px 0 6px}
.subtabs{display:inline-flex;align-items:center;gap:4px;padding:6px;margin:0;background:#F1F3F6;border-radius:999px;
  box-shadow:0 1px 2px rgba(16,24,40,.06),0 6px 18px -6px rgba(16,24,40,.14);max-width:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.stab{display:flex;align-items:center;gap:8px;height:42px;padding:0 20px;border:0;border-radius:999px;background:transparent;cursor:pointer;
  font-size:14.5px;font-weight:500;color:#465263;white-space:nowrap;transition:background .15s,color .15s}
.stab:hover{background:rgba(16,24,40,.05);color:var(--ink)}
.stab .stab-ic{display:none}
.stab.on{background:color-mix(in srgb,var(--c) 13%,#fff);color:var(--c);font-weight:600}
.stab.on .stab-ic{display:inline-flex}
.stab-n{font-size:12.5px;font-weight:500;color:var(--ink3);font-variant-numeric:tabular-nums}
.stab.on .stab-n{color:var(--c);opacity:.8}
.stab:focus-visible{outline:2px solid #4B7BEC;outline-offset:2px}
.sp-sec.off{display:none}
/* lists like the POS: coloured header row that stays, scroll inside the box, pages at the bottom */
.tw.lst{overflow:visible}
.tw.lst.xs{overflow-x:auto}.tw.lst.xs thead th{position:static}
.tw.lst thead th{position:sticky;top:var(--theadTop,0px);z-index:10;background:#1B2B44;color:#fff;font-weight:600;font-size:13px;border-bottom:0;padding-top:12px;padding-bottom:12px}
.panel.edge .tw.lst thead th,.panel.tone .tw.lst thead th{background:var(--c)}
.tw.lst thead input[type=checkbox]{accent-color:#fff}
.tw.lst tfoot td{background:#F4F6F8}
.tw.lst tbody tr:hover td{background:#F5F7FA}
.tw.lst tr.grp td{background:#F8FAFC}
.pager{display:flex;align-items:center;gap:16px;padding:10px 18px;border-top:1px solid var(--rule);flex-wrap:wrap;font-size:13.5px;color:var(--ink2)}
.pg-size{display:flex;align-items:center;gap:8px;color:var(--ink3)}
.pg-size select{width:auto;height:32px;padding:0 8px;font-size:13px}
.pg-total{margin-left:auto;color:var(--ink2)}
.pg-total b{color:var(--ink)}
.pg-nav{display:flex;align-items:center;gap:6px}
.pg-btn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--rule2);border-radius:7px;background:#fff;cursor:pointer;color:var(--ink)}
.pg-btn:hover:not(:disabled){background:var(--hover)}
.pg-btn:disabled{opacity:.4;cursor:not-allowed}
.pg-cur{min-width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--c,#1B2B44);border-radius:7px;font-weight:600;color:var(--c,#1B2B44)}
.pg-of{color:var(--ink3)}
.pg-go{display:flex;gap:6px}
.pg-go input{width:74px;height:32px;font-size:13px}
@media(max-width:700px){.pg-total{margin-left:0}}
/* badge */
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 8px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--bg);color:var(--c);border:1px solid var(--bd);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.badge.plain::before{display:none}
.stk{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.stk .sub{margin-bottom:3px}

/* empty */
.empty{padding:40px 20px;text-align:center;color:var(--ink3)}
.empty svg{color:var(--ink4);margin-bottom:8px}
.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:2px}

/* bulk bar */
.bulk{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 18px;background:#FFF7EA;border-bottom:1px solid #FCDDA8;color:#7A2E0E}
.bulk[hidden]{display:none}

/* ---------- overview ---------- */
.flow{display:grid;grid-template-columns:minmax(120px,.8fr) 22px 1fr 22px 1fr 22px 1fr 22px minmax(120px,.8fr);align-items:center;gap:8px;padding:20px 18px}
.fcol{display:flex;flex-direction:column;gap:10px}
.fcol .lane{font-size:12.5px;color:var(--ink3);font-weight:500;text-align:center}
.join{color:var(--ink4);display:grid;place-items:center}
.node{border-radius:8px;padding:12px 14px;border:1px solid var(--bd);background:var(--bg);color:var(--c);cursor:pointer;text-align:left;width:100%}
.node:hover{border-color:var(--c)}
.node h3{margin:0;font-size:13px;font-weight:600}
.node .big{display:block;font-size:30px;font-weight:600;line-height:1.15;margin-top:2px}
.node small{display:block;color:var(--ink2);font-size:12.5px}
.node.br{--c:var(--ink);--bg:#FAFBFC;--bd:var(--rule)}
@media(max-width:1000px){.flow{grid-template-columns:1fr}.join{transform:rotate(90deg)}}

.register{display:grid;grid-template-columns:repeat(9,minmax(0,1fr))}
.reg{padding:14px 16px;border-right:1px solid var(--rule);cursor:pointer;background:#fff;border-top:0;border-bottom:0;border-left:0;text-align:left}
.reg:last-child{border-right:0}
.reg:hover{background:var(--hover)}
.reg .lb{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--c)}
.reg .lb::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.reg .big{display:block;font-size:26px;font-weight:600;margin-top:4px;color:var(--ink)}
.reg small{color:var(--ink3);font-size:12.5px}
@media(max-width:1250px){.register{grid-template-columns:repeat(5,minmax(0,1fr))}.reg{border-bottom:1px solid var(--rule)}}
@media(max-width:600px){.register{grid-template-columns:repeat(2,minmax(0,1fr))}}

.alerts{list-style:none;margin:0;padding:0}
.alerts li{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid #EEF0F3}
.alerts li:last-child{border-bottom:0}
.alerts .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--bg);color:var(--c);flex:none}
.alerts .tx{flex:1}

/* settings */
.set-grid{display:grid;grid-template-columns:240px 1fr;gap:24px;padding:20px 18px;border-bottom:1px solid var(--rule)}
.set-grid:last-child{border-bottom:0}
.set-grid h3{margin:0 0 4px;font-size:14px;font-weight:600}
.set-grid p{margin:0;color:var(--ink3);font-size:13px}
@media(max-width:800px){.set-grid{grid-template-columns:1fr;gap:12px}}

/* ---------- modal & toast ---------- */
#ov{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;align-items:flex-start;justify-content:center;padding:6vh 14px;z-index:50;overflow:auto}
#ov.on{display:flex}
.mdl{background:#fff;border-radius:12px;width:100%;max-width:560px;box-shadow:0 24px 48px -12px rgba(16,24,40,.25)}
.mdl-h{display:flex;gap:12px;align-items:flex-start;padding:18px 20px 14px;border-bottom:1px solid var(--rule)}
.mdl-h h3{margin:0;font-size:17px;font-weight:600}
.mdl-h p{margin:4px 0 0;color:var(--ink3);font-size:13.5px}
.mdl-h .icon-btn{margin-left:auto;border:0}
.mdl-b{padding:18px 20px}
.mdl-b .fg{grid-template-columns:1fr 1fr}
.mdl-b .fg .s2{grid-column:1/-1}
.mdl-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--rule);background:#FAFBFC;border-radius:0 0 12px 12px}
.info{border:1px solid var(--bd);background:var(--bg);border-radius:8px;padding:12px 14px;margin-top:14px;color:var(--ink2)}
.info b{color:var(--c)}
#toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:11px 16px;border-radius:9px;font-size:13.5px;box-shadow:0 8px 24px rgba(16,24,40,.2);max-width:380px;animation:tin .18s ease-out}
.toast.err{background:#B42318}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}

/* ---------- account menu ---------- */

async function hashPin(pin, salt) {
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch { let h = 7; for (const c of salt + ':' + pin) h = (h * 31 + c.charCodeAt(0)) | 0; return 'x' + h; }
}

/* one-time rename of old branch codes: BT1 -> BT1-TPR, BT2 -> BT2-PS */
const RENAME = { BT1: 'BT1-TPR', BT2: 'BT2-PS' };
let migrated = false;
async function migrateBranches() {
  if (migrated) return; migrated = true;
  const fix = v => RENAME[v] || v, jobs = [];
  for (const r of S.ng.values()) if (RENAME[r.branch]) jobs.push(['ng', { ...clone(r), branch: fix(r.branch) }]);
  for (const g of S.good.values()) {
    if (RENAME[g.fromBranch] || (g.dispatches||[]).some(d => RENAME[d.branch]))
      jobs.push(['good', { ...clone(g), fromBranch: fix(g.fromBranch), dispatches: (g.dispatches||[]).map(d => ({ ...d, branch: fix(d.branch) })) }]);
  }
  const c = cfg();
  if (Array.isArray(c.branches) && c.branches.some(b => RENAME[b])) jobs.push(['settings', { ...clone(c), branches: c.branches.map(fix) }]);
  if (!jobs.length) return;
  if (DB) { for (const [col, rec] of jobs) await put(col, rec); }
  else { jobs.forEach(([col, rec]) => S[col].set(rec.id, rec)); saveLocal(); refresh(); }
}

async function put(col, rec) {

  if (!DB) return saveLocal();
  if (FS) { FS.collection(col).doc(rec.id).set(rec).catch(writeErr); unarchive([[col, rec.id]]); return; }
  try { await DB.collection(col).doc(rec.id).set(rec); } catch (e) { writeErr(e); }
}
async function remove(col, id) {

/* many records at once (restore, import, delete all): one screen update, Firebase writes in batches */
async function putMany(list) {
  if (!DB) { list.forEach(([c, r]) => S[c].set(r.id, r)); saveLocal(); refresh(); return; }
  if (!FS) { for (const [c, r] of list) await put(c, r); return; }
  list.forEach(([c, r]) => S[c].set(r.id, r)); refresh();
  for (let i = 0; i < list.length; i += 400) { const b = FS.batch(); list.slice(i, i + 400).forEach(([c, r]) => b.set(FS.collection(c).doc(r.id), r)); b.commit().catch(writeErr); }
  unarchive(list.map(([c, r]) => [c, r.id]));
}
async function removeMany(list) {
  if (!DB) { list.forEach(([c, id]) => S[c].delete(id)); saveLocal(); refresh(); return; }
  if (!FS) { for (const [c, id] of list) await remove(c, id); return; }
  unarchive(list);
  list.forEach(([c, id]) => S[c].delete(id)); refresh();
  for (let i = 0; i < list.length; i += 400) { const b = FS.batch(); list.slice(i, i + 400).forEach(([c, id]) => b.delete(FS.collection(c).doc(id))); b.commit().catch(writeErr); }
}
/* ================= archive (Firebase only) =================
   Finished lines older than 90 days are packed many-to-one into "archive" documents.
   Every device reads the whole list each time it opens the app, and the free Firebase plan allows
   50,000 reads a day; packing keeps that small for years. Archived lines still show everywhere as usual,
   and change back to normal lines if someone edits or undoes them. */
const ARC_COLS = ['ng', 'good'], ARC_DAYS = 90, ARC_MAX = 700000;
const LIVE = { ng: new Map(), good: new Map() };
let ARCB = new Map();                 /* bundle id -> { id, ng:[], good:[] } */
const ARCOF = new Map();              /* 'ng:id' -> bundle id */
function compose(c) { const m = new Map(); for (const b of ARCB.values()) for (const r of (b[c] || [])) m.set(r.id, r); for (const [k, r] of LIVE[c]) m.set(k, r); S[c] = m; }
function setBundles(docs) {
  ARCB = new Map(docs.map(d => [d.id, d])); ARCOF.clear();
  for (const b of ARCB.values()) for (const c of ARC_COLS) for (const r of (b[c] || [])) ARCOF.set(c + ':' + r.id, b.id);
  ARC_COLS.forEach(compose);
}
function unarchive(pairs) {
  if (!FS) return; const touched = new Map();
  for (const [c, id] of pairs) { const bid = ARCOF.get(c + ':' + id); if (!bid) continue;
    const b = touched.get(bid) || { ...ARCB.get(bid), ng: [...(ARCB.get(bid).ng || [])], good: [...(ARCB.get(bid).good || [])] };
    b[c] = b[c].filter(r => r.id !== id); touched.set(bid, b); ARCOF.delete(c + ':' + id); }
  for (const b of touched.values()) { ARCB.set(b.id, b);
    (b.ng.length || b.good.length ? FS.collection('archive').doc(b.id).set(b) : FS.collection('archive').doc(b.id).delete()).catch(writeErr); }
}
const FINAL = new Set(['DONE', 'DED', 'DISP']);
async function runArchive(force) {
  if (!FS || ME?.role !== 'gm' || readOnly) return 0;
  if (!force && Date.now() - (+lsGet('arcLast', 0) || 0) < 864e5) return 0;
  lsSet('arcLast', Date.now());
  const cut = Date.now() - ARC_DAYS * 864e5, old = x => (x.updatedAt || x.createdAt || 0) < cut;
  const ngs = [...LIVE.ng.values()].filter(r => old(r) && stKey(r).every(k => FINAL.has(k)));
  const goods = new Map();
  const okNg = ngs.filter(r => { if (!r.goodId) return true; const g = S.good.get(r.goodId); if (!g) return true;
    if (!old(g) || goodBal(g) > 0) return false; if (LIVE.good.has(g.id)) goods.set(g.id, g); return true; });
  const okSet = new Set(okNg.map(r => r.id));
  const liveRefs = new Set([...LIVE.ng.values()].filter(r => !okSet.has(r.id)).map(r => r.goodId).filter(Boolean));
  for (const g of LIVE.good.values()) if (!goods.has(g.id) && !liveRefs.has(g.id) && old(g) && goodBal(g) <= 0) goods.set(g.id, g);
  const items = [...okNg.map(r => ['ng', r]), ...[...goods.values()].map(g => ['good', g])];
  if (items.length < (force ? 1 : 20)) return 0;
  /* pack into the newest bundle that still has room, then new ones */
  const work = new Map([...ARCB].map(([k, b]) => [k, { ...b, ng: [...(b.ng || [])], good: [...(b.good || [])] }]));
  for (const [c, r] of items) { const bid = ARCOF.get(c + ':' + r.id); if (bid && work.has(bid)) work.get(bid)[c] = work.get(bid)[c].filter(x => x.id !== r.id); }
  const enc = new TextEncoder(), size = x => enc.encode(JSON.stringify(x)).length, changed = new Set();   /* bytes: Khmer letters take 3 */
  let cur = [...work.values()].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)).pop(), curSz = cur ? size(cur) : 0;
  if (!cur || curSz > ARC_MAX * 0.9) cur = null;
  let n = 0;
  for (const [c, r] of items) {
    const js = size(r) + 2;
    if (!cur || curSz + js > ARC_MAX) { cur = { id: 'b' + Date.now().toString(36) + (n++), createdAt: Date.now() + n, ng: [], good: [] }; work.set(cur.id, cur); curSz = 120; }
    cur[c].push(r); curSz += js; changed.add(cur.id);
  }
  for (const [c, r] of items) { const bid = ARCOF.get(c + ':' + r.id); if (bid) changed.add(bid); }
  for (const bid of changed) { const b = work.get(bid); b.updatedAt = Date.now();
    if (b.ng.length || b.good.length) await FS.collection('archive').doc(bid).set(b); else await FS.collection('archive').doc(bid).delete(); }
  for (let i = 0; i < items.length; i += 400) { const bt = FS.batch(); items.slice(i, i + 400).forEach(([c, r]) => bt.delete(FS.collection(c).doc(r.id))); await bt.commit(); }
  return items.length;
}

function writeErr(e) {
  if (e?.code === 'permission-denied') { toast('This device is not allowed to save. Ask the General Manager to connect it again.', 1); return; }
  if (e?.code === 'resource-exhausted') { toast('The free daily Firebase limit is used up. Changes sync again tomorrow.', 1); return; }
  if (e?.code === 'invalid_argument') { readOnly = true; setMode('readonly'); toast('You have view-only access. Changes were not saved.', 1); }
  else if (e?.code === 'quota_exceeded') toast('Storage is full: ' + e.message, 1);
  else toast('Could not save (' + (e?.code || e) + '). Try again.', 1);
}
const guard = () => { if (readOnly) { toast('You have view-only access.', 1); return true; } return false; };

    offline:['Offline, will sync','#B54708'] };

}

function stInfo(r) {
  const out = [];
  const add = (k, sub) => out.push([k, sub]);
  if (r.status === 'WH') add('WH', `${plural(days(r.date),'day')} in warehouse`);
  if (r.status === 'SUP') add('SUP', `${esc(r.rtvNo||'')}, ${plural(days(r.rtvDate),'day')}`);
  if (r.status === 'EXC') {
    const g = r.goodId && S.good.get(r.goodId);
    if (g) {
      const bal = goodBal(g), sent = BR().filter(b => goodSent(g,b) > 0).map(b => `${esc(b)} ${goodSent(g,b)}`).join(', ');
      if (bal <= 0) add('DONE', `Sent to ${sent}`);
      else if (sent) add('PART', `Sent ${sent}, ${bal} left in warehouse`);
      else add('EXC', `${bal} pcs in warehouse, not sent`);
    }
  }
  if (r.status === 'REJ') r.dispDate ? add('DISP', `${fmtD(r.dispDate)}, loss ${money(val(r))}`) : add('REJ', `${esc(r.rejReason||'')}${r.rejReason?', ':''}${plural(days(r.settleDate),'day')} waiting for disposal`);
  if (r.cnNo) r.cnStatus === 'deducted' ? add('DED', `${esc(r.cnNo)} on ${esc(r.invNo||'')}`) : add('CNP', `${esc(r.cnNo)}, ${money(r.cnAmount)}`);
  if (!out.length) add('DONE', '');
  return out;
}

/* ================= modal ================= */
function modal({ title, sub = '', body, ok = 'Confirm', tone = 't-ink', onOk, okDisabled }) {
  const ov = $('#ov');
  ov.innerHTML = `<form class="mdl" novalidate><div class="mdl-h"><div><h3>${title}</h3>${sub ? `<p>${sub}</p>` : ''}</div>
    <button type="button" class="icon-btn" data-x aria-label="Close">${ic('x')}</button></div>
    <div class="mdl-b">${body}</div>
    <div class="mdl-f"><button type="button" class="btn" data-x>Cancel</button><button class="btn solid ${tone}" ${okDisabled?'disabled':''}>${ok}</button></div></form>`;
  ov.classList.add('on');
  const f = ov.querySelector('form');
  const close = () => { document.removeEventListener('keydown', onKey); if (ov.querySelector('form') !== f) return; ov.classList.remove('on'); ov.innerHTML = ''; };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  f.querySelectorAll('[data-x]').forEach(b => b.onclick = close);
  ov.onmousedown = e => { if (e.target === ov) close(); };
  f.onsubmit = async e => {
    e.preventDefault();
    if (!f.checkValidity()) { f.reportValidity(); return; }
    if (f.dataset.busy) return; f.dataset.busy = '1';   // stops double-clicks saving twice
    const data = Object.fromEntries(new FormData(f));
    try { if (await onOk(data, f) !== false) close(); } finally { delete f.dataset.busy; }
  };
  setTimeout(() => f.querySelector('.mdl-b input:not([type=hidden]):not([type=checkbox]),.mdl-b select')?.focus(), 30);
  return f;
}
const confirmBox = (title, msg, ok, tone, fn) => modal({ title, body: `<p style="margin:0">${msg}</p>`, ok, tone, onOk: fn });

  navigator.clipboard.writeText(txt).then(() => toast(`Copied ${plural(rows.length - 1, 'row')}. Paste into Excel.`))

}
function download(name, text, type) {
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  } catch { toast('Download is not available here. Use Copy instead.', 1); }
}

let rpEl = null;

const rpOutside = e => { if (rpEl && !rpEl.contains(e.target) && !e.target.closest('.tbtn')) closeRange(); };
const rpKey = e => { if (e.key === 'Escape') closeRange(); };
function openRange(btn, cur, onPick) {
  if (rpEl) { closeRange(); return; }
  const [cf, ct] = rangeOf(cur);
  const st = { view: 'presets', a: cf, b: ct, hover: null, base: (() => { const d = new Date((cf || today()) + 'T00:00'); return new Date(d.getFullYear(), d.getMonth(), 1); })() };
  rpEl = document.createElement('div'); rpEl.className = 'rp'; document.body.appendChild(rpEl);
  const place = () => { const b = btn.getBoundingClientRect(), w = rpEl.offsetWidth;
    rpEl.style.top = (b.bottom + window.scrollY + 6) + 'px'; rpEl.style.left = Math.max(10, Math.min(b.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - w - 10)) + 'px'; };
  const month = base => {
    const y = base.getFullYear(), m = base.getMonth(), first = new Date(y, m, 1), start = addD(first, -first.getDay()), td = today();
    const lo = st.a && (st.b || st.hover) ? [st.a, st.b || st.hover].sort()[0] : st.a, hi = st.a && (st.b || st.hover) ? [st.a, st.b || st.hover].sort()[1] : st.a;
    let cells = '';

      cells += `<button type="button" class="${cls}" data-d="${k}">${d.getDate()}</button>`; }
    return `<div class="cal"><div class="cal-h">${base.toLocaleDateString('en-GB', { month: 'short', year: 'numeric' })}</div>
      <div class="cal-g">${['Su','Mo','Tu','We','Th','Fr','Sa'].map(x => `<span>${x}</span>`).join('')}${cells}</div></div>`;
  };
  const render = () => {
    if (st.view === 'presets') {
      rpEl.innerHTML = `<div class="rp-pre">
        <div class="rp-top"><button type="button" class="rp-all ${cur.key === 'all' ? 'on' : ''}" data-k="all">All time</button>

    if (b.dataset.k) { onPick(b.dataset.k === 'all' ? { key: 'all' } : { key: b.dataset.k }); return closeRange(); }
    if (b.dataset.view) { st.view = b.dataset.view; return render(); }

    if (b.dataset.d) { const k = b.dataset.d; if (!st.a || st.b) { st.a = k; st.b = null; } else { st.b = k; if (st.b < st.a) [st.a, st.b] = [st.b, st.a]; } st.hover = null; return render(); }

function nextTransfer() {
  const p = 'TO-' + today().slice(2).replace(/-/g,'') + '-';
  const used = [...S.good.values()].flatMap(g => (g.dispatches||[]).map(d => d.doc)).filter(n => n && n.startsWith(p)).map(n => +n.slice(p.length) || 0);
  return p + String((used.length ? Math.max(...used) : 0) + 1).padStart(2,'0');
}
function nextRtv() {
  const p = 'RTV-' + today().slice(2).replace(/-/g,'') + '-';
  const used = [...S.ng.values()].map(r => r.rtvNo).filter(n => n && n.startsWith(p)).map(n => +n.slice(p.length) || 0);
  return p + String((used.length ? Math.max(...used) : 0) + 1).padStart(2,'0');

function returnToSupplier(sel) {

  modal({ title: 'Return to supplier', tone: 't-sup', ok: 'Confirm return',
    sub: `${plural(sel.length,'line')}, ${num(sum(sel, r => r.qty))} pcs, ${money(sum(sel, val))} to <b>${esc(sel[0].supplier)}</b>`,

    onOk: async d => {

function undoNG(r) {
  if (guard()) return;
  if (r.status === 'SUP') return confirmBox('Undo the return?', `<b>${esc(r.name)}</b> goes back to At Warehouse and is removed from ${esc(r.rtvNo)}.`, 'Undo return', 't-ink',
    () => { const n = clone(r); n.status = 'WH'; ['rtvNo','rtvDate','rtvNote','rtvBy'].forEach(k => delete n[k]); put('ng', n); toast('Return undone'); });
  const g = r.goodId && S.good.get(r.goodId);
  const lose = [];
  if (g) lose.push(`the good stock from this exchange (${num(g.qty)} pcs)`);
  (g?.dispatches || []).forEach(d => lose.push(`transfer ${esc(d.doc || '')} to ${esc(d.branch)}: ${num(d.qty)} pcs on ${fmtD(d.date)}`));
  if (r.cnNo) lose.push(`credit note ${esc(r.cnNo)}${r.cnStatus === 'deducted' ? ` and its deduction on ${esc(r.invNo || '')}` : ''}`);
  if (r.status === 'REJ') lose.push(r.dispDate ? `the rejection and disposal record ${esc(r.dispNo || '')}` : 'the rejection');
  const sent = (g?.dispatches || []).length > 0;
  confirmBox('Undo the settlement?', `<b>${esc(r.name)}</b> goes back to <b>At Supplier</b>.` +
    (lose.length ? `<br><br>This also removes:<ul style="margin:6px 0 0;padding-left:18px">${lose.map(x => `<li>${x}</li>`).join('')}</ul>` : '') +
    (sent ? `<div class="info t-ng" style="margin-top:12px">The product was already sent to a store. Make sure the store stock is corrected too.</div>` : ''),
    'Undo settlement', sent ? 't-ng' : 't-ink', async () => {
      const n = clone(r); n.status = 'SUP';
      ['settleDate','exQty','goodId','cnNo','cnDate','cnAmount','cnStatus','invNo','invDate','settleNote','rejReason','dispDate','dispNo'].forEach(k => delete n[k]);
      if (g) await remove('good', g.id);
      await put('ng', n); toast(`${esc(r.name)} is back at supplier`);
    });
}

function settleExchange(r) {
  const f = modal({ title: 'Exchange: receive good product', tone: 't-bl', ok: 'Receive good product',
    sub: `${esc(r.supplier)}, ${esc(r.rtvNo)}. <b>${esc(r.name)}</b>, ${r.qty} pcs returned.`,
    body: `<div class="fg"><label class="f">Date received<input type="date" name="d" value="${today()}" required></label>
      <label class="f">Good quantity received<input type="number" name="q" min="0" max="${r.qty}" step="1" value="${r.qty}" required></label>
      <label class="f">New expiry date <span class="req">required</span><input type="date" name="exp" required></label><label class="f">Supplier document no<input name="doc"></label>
      <label class="f s2">Note<input name="note"></label></div>
      <div id="shortBox" class="info t-cn" hidden><b><span id="shortQ"></span> pcs missing.</b> If the supplier gives a credit note for them, enter it here (optional).
        <div class="fg" style="margin-top:10px"><label class="f">Credit note no<input name="cnNo"></label><label class="f">Credit note amount ($)<input type="number" step="0.01" min="0" name="cnAmt"></label></div></div>`,
    onOk: async d => {
      const q = +d.q;
      if (q > 0 && !d.exp) { toast('Enter the new expiry date of the good product', 1); return false; }
      if (q > 0 && d.exp <= d.d) { toast('New expiry date must be after the date received', 1); return false; }
      const g = { id: uid(), createdAt: Date.now(), date: d.d, supplier: r.supplier, barcode: r.barcode, name: r.name, qty: q, cost: r.cost,
        expiry: d.exp, source: 'Exchange', ngId: r.id, rtvNo: r.rtvNo, fromBranch: r.branch, doc: d.doc.trim(), note: d.note.trim(), dispatches: [] };
      const n = { ...clone(r), status: 'EXC', settleDate: d.d, exQty: q, settleNote: d.note.trim() };
      if (q > 0) { n.goodId = g.id; await put('good', g); }
      if (q < r.qty && d.cnNo.trim()) Object.assign(n, { cnNo: d.cnNo.trim(), cnDate: d.d, cnAmount: +d.cnAmt || 0, cnStatus: 'pending' });
      await put('ng', n); toast(`${q} good pcs received into Good stock`);
    } });
  const upd = () => { f.exp.required = (+f.q.value || 0) > 0; const s = r.qty - (+f.q.value||0); f.querySelector('#shortBox').hidden = s <= 0; f.querySelector('#shortQ').textContent = s; f.cnAmt.value = (Math.max(0,s) * (+r.cost||0)).toFixed(2); };
  f.q.addEventListener('input', upd); f.exp.min = isoD(addD(new Date(today() + 'T00:00'), 1));
}
function settleCN(r) {
  modal({ title: 'Credit note', tone: 't-cn', ok: 'Save credit note',
    sub: `${esc(r.supplier)}, ${esc(r.rtvNo)}. <b>${esc(r.name)}</b>, ${r.qty} pcs × ${money(r.cost)}.`,
    body: `<div class="fg"><label class="f">Credit note no<input name="no" required></label><label class="f">Credit note date<input type="date" name="d" value="${today()}" required></label>
      <label class="f">Amount ($)<input type="number" name="amt" step="0.01" min="0" value="${val(r).toFixed(2)}" required></label>
      <label class="f">Already deducted on invoice<input name="inv" placeholder="Leave empty if not yet"></label>
      <label class="f s2">Note<input name="note"></label></div>`,
    onOk: async d => {
      const n = { ...clone(r), status: 'CN', settleDate: d.d, cnNo: d.no.trim(), cnDate: d.d, cnAmount: +d.amt, cnStatus: d.inv.trim() ? 'deducted' : 'pending', settleNote: d.note.trim() };
      if (d.inv.trim()) { n.invNo = d.inv.trim(); n.invDate = d.d; }
      await put('ng', n); toast(`Credit note ${esc(n.cnNo)} saved (${money(n.cnAmount)})`);
    } });
}
function settleReject(r) {
  modal({ title: 'Supplier rejected the return', tone: 't-rj', ok: 'Mark rejected',
    sub: `${esc(r.supplier)}, ${esc(r.rtvNo)}. <b>${esc(r.name)}</b>, ${r.qty} pcs. The supplier gives no exchange and no credit note.`,
    body: `<div class="fg"><label class="f">Date rejected<input type="date" name="d" value="${today()}" required></label>
      <label class="f">Reject reason<input name="why" required placeholder="e.g. returned after deadline"></label>
      <label class="f s2">Note<input name="note"></label></div>
      <div class="info t-rj">The product comes back to the warehouse and waits for disposal. It is a loss of <b>${money(val(r))}</b>.</div>`,
    onOk: async d => { await put('ng', { ...clone(r), status: 'REJ', settleDate: d.d, rejReason: d.why.trim(), settleNote: d.note.trim() }); toast(`${esc(r.name)} marked rejected`); } });
}
function markDisposed(r) {
  modal({ title: 'Mark as disposed', tone: 't-disp', ok: 'Mark disposed', sub: `<b>${esc(r.name)}</b>, ${r.qty} pcs, loss ${money(val(r))}`,
    body: `<div class="fg"><label class="f">Disposal date<input type="date" name="d" value="${today()}" required></label>
      <label class="f">Disposal no / approved by<input name="no" required placeholder="e.g. DSP-001 / Manager"></label></div>`,
    onOk: async d => { await put('ng', { ...clone(r), dispDate: d.d, dispNo: d.no.trim() }); toast(`${esc(r.name)} marked disposed`); } });
}
function markDeducted(r) {
  modal({ title: 'Mark credit note as deducted', tone: 't-cn', ok: 'Mark deducted', sub: `${esc(r.cnNo)} from ${esc(r.supplier)}, ${money(r.cnAmount)}`,
    body: `<div class="fg"><label class="f">Invoice no<input name="inv" required></label><label class="f">Invoice date<input type="date" name="d" value="${today()}" required></label></div>`,
    onOk: async d => { await put('ng', { ...clone(r), cnStatus: 'deducted', invNo: d.inv.trim(), invDate: d.d }); toast(`${esc(r.cnNo)} marked deducted`); } });
}

/* ================= Excel import / export (same layout as NG_Good_Master_List.xlsx) ================= */
async function loadXLSX() {
  if (window.XLSX) return window.XLSX;
  const add = src => new Promise((res, rej) => { const sc = document.createElement('script');
    sc.src = src; sc.onload = res; sc.onerror = () => { sc.remove(); rej(new Error('load')); }; document.head.appendChild(sc); });
  await add(LIB + 'xlsx.full.min.js').catch(() => add('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'));
  return window.XLSX;
}
const xlNeed = async () => { try { return await loadXLSX(); } catch { toast('Excel tools could not load. Connect to the internet and try again.', 1); return null; } };
const nh = h => String(h ?? '').toLowerCase().replace(/\s+/g, ' ').trim();
const serialFromIso = d => (Date.UTC(+d.slice(0,4), +d.slice(5,7) - 1, +d.slice(8,10)) - Date.UTC(1899, 11, 30)) / 864e5;
function xDate(v) {
  if (v == null || v === '') return '';
  if (typeof v === 'number' && v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 864e5)); return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`; }
  const s = String(v).trim(); let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[-\/. ]([A-Za-z]{3,}|\d{1,2})[-\/. ](\d{2,4})$/);
  if (m) { const mon = isNaN(m[2]) ? ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(m[2].slice(0,3).toLowerCase()) + 1 : +m[2];
    let y = +m[3]; if (y < 100) y += 2000; if (mon > 0) return `${y}-${String(mon).padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  return '';
}
const xNum = v => { if (v === '' || v == null) return null; const n = +String(v).replace(/[$,\s]/g, ''); return isNaN(n) ? null : n; };
const xTxt = v => String(v ?? '').trim();
const COLMAP = { date: 'date received', branch: 'branch', barcode: 'barcode', name: 'product name', supplier: 'supplier', reason: 'reason', expiry: 'expiry date',
  qty: 'qty', cost: 'unit cost ($)', by: 'received by', rtvNo: 'rtv no', rtvDate: 'return date', settle: 'settlement', sdate: 'settle date', gq: 'good qty received',
  nexp: 'new expiry date', cnNo: 'cn no', cnAmt: 'cn amount ($)', inv: 'deducted on invoice', ddate: 'deduct date', rej: 'reject reason', dpdate: 'disposal date',
  dpno: 'disposal no / approved by', note: 'note' };
const sigOf = r => [r.date, r.branch, nh(r.barcode || r.name), +r.qty, r.rtvNo || ''].join('|');

function parseMaster(X, wb) {
  const out = { ng: [], good: [], suppliers: [], errors: [], examples: 0, rows: 0 };
  const shName = wb.SheetNames.find(n => nh(n) === 'master_list') || wb.SheetNames[0];
  const rows = X.utils.sheet_to_json(wb.Sheets[shName], { header: 1, raw: true, defval: '' });
  const hr = rows.findIndex(r => r.some(c => nh(c) === 'product name'));
  if (hr < 0) { out.errors.push('No "Product name" header found. Use the Master_List sheet from the Excel master list.'); return out; }
  const head = rows[hr].map(nh), at = {};
  for (const [k, h] of Object.entries(COLMAP)) { const i = head.indexOf(h); if (i >= 0) at[k] = i; }
  for (const k of ['date', 'branch', 'name', 'supplier', 'qty']) if (at[k] == null) out.errors.push(`Missing column "${COLMAP[k]}".`);
  if (out.errors.length) return out;
  const sends = head.map((h, i) => { const m = h.match(/^sent (.+) \(qty\)$/); if (!m) return null;
    const b = m[1], br = BR().find(x => nh(x) === b) || rows[hr][i].toString().replace(/^Sent\s+/i, '').replace(/\s*\(qty\)$/i, '');
    return { br, q: i, d: head.indexOf('date sent ' + b), t: head.indexOf('transfer no ' + b) }; }).filter(Boolean);
  const existing = new Set([...S.ng.values()].map(sigOf)); const seen = new Set();
  rows.slice(hr + 1).forEach((row, i) => {
    const g = k => at[k] == null ? '' : row[at[k]], rn = hr + i + 2, name = xTxt(g('name'));
    if (!name) return;
    out.rows++;
    const note = xTxt(g('note'));
    const id = uid() + i, r = { id, createdAt: Date.now() + i, date: xDate(g('date')), branch: xTxt(g('branch')), barcode: xTxt(g('barcode')), name,
      supplier: xTxt(g('supplier')), reason: /damag/i.test(g('reason')) ? 'Damaged' : 'Expired', expiry: xDate(g('expiry')), qty: xNum(g('qty')), cost: xNum(g('cost')) || 0,
      by: xTxt(g('by')), note, status: 'WH', importedRow: rn };
    const err = m => out.errors.push(`Row ${rn} (${esc(name)}): ${m}`);
    if (!r.date) return err('Date received is missing or not a date.');
    if (!r.branch) return err('Branch is empty.');
    if (!r.supplier) return err('Supplier is empty.');
    if (!(r.qty > 0)) return err('Qty must be more than 0.');
    const rtv = xTxt(g('rtvNo')), settle = nh(g('settle'));
    if (rtv) Object.assign(r, { status: 'SUP', rtvNo: rtv, rtvDate: xDate(g('rtvDate')) || r.date });
    if (settle && !rtv) return err('Settlement is filled but RTV no is empty.');
    const sd = xDate(g('sdate')) || r.rtvDate || r.date, cnNo = xTxt(g('cnNo'));
    let good = null;
    if (settle === 'exchange') {
      const gq = xNum(g('gq')) ?? r.qty;
      if (gq > r.qty) return err('Good qty received is more than Qty.');
      Object.assign(r, { status: 'EXC', settleDate: sd, exQty: gq });
      if (gq > 0) {
        good = { id: 'g' + id, createdAt: Date.now() + i, date: sd, supplier: r.supplier, barcode: r.barcode, name: r.name, qty: gq, cost: r.cost, expiry: xDate(g('nexp')),
          source: 'Exchange', ngId: id, rtvNo: rtv, fromBranch: r.branch, doc: '', note: '', dispatches: [] };
        for (const s2 of sends) { const q = xNum(row[s2.q]); if (q > 0) good.dispatches.push({ branch: s2.br, qty: q, date: s2.d >= 0 ? xDate(row[s2.d]) || sd : sd, doc: s2.t >= 0 ? xTxt(row[s2.t]) : '', by: '', at: Date.now() + i }); }
        if (goodSent(good) > gq) return err('Sent to stores is more than Good qty received.');
        r.goodId = good.id;
      }
    } else if (settle === 'credit note') Object.assign(r, { status: 'CN', settleDate: sd });
    else if (settle === 'rejected') Object.assign(r, { status: 'REJ', settleDate: sd, rejReason: xTxt(g('rej')), dispDate: xDate(g('dpdate')) || undefined, dispNo: xTxt(g('dpno')) || undefined });
    else if (settle) return err(`Settlement "${esc(g('settle'))}" is not Exchange, Credit note or Rejected.`);
    if (cnNo) { const inv = xTxt(g('inv'));
      Object.assign(r, { cnNo, cnDate: sd, cnAmount: xNum(g('cnAmt')) ?? val(r), cnStatus: inv ? 'deducted' : 'pending' });
      if (inv) Object.assign(r, { invNo: inv, invDate: xDate(g('ddate')) || sd }); }
    if (/^example/i.test(note)) { r.isExample = true; out.examples++; }
    const sg = sigOf(r); if (existing.has(sg) || seen.has(sg)) { r.isDup = true; } seen.add(sg);
    out.ng.push(r); if (good) { good.forNg = id; out.good.push(good); }
  });
  const sp = wb.SheetNames.find(n => nh(n) === 'suppliers');
  if (sp) { const sr = X.utils.sheet_to_json(wb.Sheets[sp], { header: 1, raw: true, defval: '' }); const h = sr.findIndex(r => r.some(c => nh(c) === 'supplier name'));
    if (h >= 0) { const hd = sr[h].map(nh), ix = n => hd.indexOf(n);
      sr.slice(h + 1).forEach(r => { const n = xTxt(r[ix('supplier name')]); if (n) out.suppliers.push({ name: n, contact: xTxt(r[ix('contact person')]), phone: xTxt(r[ix('phone')]), terms: xTxt(r[ix('return terms')]) }); }); } }
  return out;
}

      const sups = newSup.map(s2 => ({ id: uid(), createdAt: Date.now(), ...s2 }));

      toast(`Imported ${plural(take.length, 'line')}${sups.length ? ` and ${plural(sups.length, 'supplier')}` : ''}`);
    } });

      g ? goodBal(g) : '', SDEF[main][1], r.cnNo ? (r.cnStatus === 'deducted' ? 'Deducted' : 'Pending deduction') : '', dw, r.note];
  });
  const aoa = [[`${company()} – Not Good & Good Stock Control – Master List`], [`Exported from the web app on ${fmtD(today())}${ME ? ' by ' + ME.name : ''}. Import this file back in Settings → Backup & data.`], head, ...data];

  const sws = X.utils.aoa_to_sheet([['Supplier list'], [''], ['Supplier name','Contact person','Phone','Return terms'],

  const buf = X.write(wb, { bookType: 'xlsx', type: 'array' });
  download(`${company().replace(/\W+/g, '-')}-Master-List-${today()}.xlsx`, buf, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  toast(`Exported ${plural(data.length, 'line')} to Excel`);
}

function downloadBackup() {
  if (!can('backup')) return toast('Your privilege does not allow downloading backups.', 1);
  const o = { app: 'returns-control', version: 1, exportedAt: new Date().toISOString() }; for (const k in S) o[k] = [...S[k].values()];
  download(`backup-${company().replace(/\W+/g,'-').toLowerCase()}-${today()}.json`, JSON.stringify(o, null, 1), 'application/json');
  if (!readOnly) put('settings', { ...clone(cfg()), id: 'app', lastBackupAt: Date.now() });
}
/* ================= backup restore (Settings, or the first screen of an empty database) ================= */
const isBackup = o => !!o && Array.isArray(o.ng);
async function restoreBackup(o) {
  const list = [];
  for (const k of Object.keys(S)) for (const r of (Array.isArray(o[k]) ? o[k] : [])) if (r && r.id) list.push([k, r]);
  await putMany(list);
}

  if (u && u.status !== 'inactive') { if (u.fbUid !== user.uid) put('users', { ...clone(u), fbUid: user.uid }); signIn(u); return; }
  if (isOwner) return ownerSetup(user);
  ssSet('fb_note', u ? 'This user is inactive. Ask a General Manager.' : 'This user is not set up in the app yet. Ask a General Manager.');
  firebase.auth().signOut();
}
function ownerSetup(user, note) {
  const el = $('#auth'); el.hidden = false; const empty = !S.users.size && !S.ng.size;
  el.innerHTML = `<div class="auth-card">${markHtml()}<h1>${empty ? 'Set up the app' : 'Create your user'}</h1>
    <p>You signed in with the owner account <b>${OWNER_ID}</b>. It becomes a General Manager, who adds the other users and sets their privileges.</p>
    ${note ? `<div class="info t-good">${note}</div>` : ''}
    <form id="ownF" autocomplete="off">
      <label class="f">Company name<input name="co" value="${esc(company())}" required></label>
      <label class="f">Your name<input name="name" required></label>
      <button class="btn solid t-ink">Start</button></form>
    ${empty ? `<div class="auth-alt"><span class="sub">Moving data from another computer? Load its backup file first.</span>
      <label class="btn" style="cursor:pointer">${ic('ul',15)} Restore from a backup file<input type="file" id="setupBk" accept=".json,application/json" hidden></label></div>` : ''}</div>`;
  setTimeout(() => $('#ownF [name=name]')?.focus(), 50);
  $('#setupBk') && ($('#setupBk').onchange = async e => {
    const file = e.target.files[0]; e.target.value = ''; if (!file) return;
    let o; try { o = JSON.parse(await file.text()); } catch { return toast('This file is not a valid backup', 1); }
    if (!isBackup(o)) return toast('This file is not a backup from this app', 1);
    await restoreBackup(o);
    const u = [...S.users.values()].find(x => x.uid === OWNER_ID || x.fbUid === user.uid);
    if (u) return fbPickUser(user);
    ownerSetup(user, `Backup restored: ${plural(o.ng.length, 'Not Good line')}. Enter your name to start. Then give each user a password in Settings → Users.`);
  });
  $('#ownF').onsubmit = async e => {
    e.preventDefault(); const d = Object.fromEntries(new FormData(e.target));
    if (!S.roles.size) for (let i = 0; i < DEFAULT_ROLES.length; i++) await put('roles', { ...clone(DEFAULT_ROLES[i]), order: i, v: 3 });
    if (d.co.trim() !== cfg().company) await put('settings', { ...clone(cfg()), id: 'app', company: d.co.trim() });
    const id = uid();
    await put('users', { id, uid: OWNER_ID, name: d.name.trim(), role: 'gm', outlets: ['ALL'], status: 'active', fbUid: user.uid, createdAt: Date.now() });
    signIn(S.users.get(id));
  };
}
async function bootFirebase() {
  setMode('connecting');
  try { for (const m of ['app', 'auth', 'firestore']) await loadJS(LIB + 'firebase-' + m + '-compat.js').catch(() => loadJS(FB_SDK + m + '-compat.js')); }
  catch { setMode('error'); $('#auth').hidden = false;
    $('#auth').innerHTML = `<div class="auth-card">${markHtml()}<h1>Cannot reach Firebase</h1><p>Check the internet connection, then reload this page.</p><button class="btn solid t-ink" onclick="location.reload()">Reload</button></div>`; return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  /* signed in until the browser is closed or the user signs out (shared shop devices) */
  try { await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.SESSION); } catch {}
  FS = firebase.firestore();
  try { FS.settings({ ignoreUndefinedProperties: true, merge: true }); } catch {}
  try { await FS.enablePersistence({ synchronizeTabs: true }); } catch {}   /* a copy stays on this device: it opens and saves offline */
  let started = false;
  firebase.auth().onAuthStateChanged(u => {
    if (u && !started) { started = true; fbLive(u); }
    else if (!u && started) location.reload();      /* signed out: start again at the sign-in screen */
    else if (!u) loginScreen();
  });
}
function fbLive(user) {
  DB = FS; showAuth('loading');
  const cols = [...Object.keys(S), 'archive'], seen = new Set(), live = new Set(); let begun = false, denied = false;
  const begin = () => { if (begun) return; begun = true; migrateBranches(); fbPickUser(user); };
  const status = () => setMode(live.size === cols.length ? 'online' : 'offline');
  const timer = setTimeout(() => { if (seen.size === cols.length) { begin(); status(); } else setMode('slow'); }, 8000);
  for (const c of cols) FS.collection(c).onSnapshot({ includeMetadataChanges: true }, snap => {
    const changed = !seen.has(c) || snap.docChanges().length > 0;
    seen.add(c); snap.metadata.fromCache ? live.delete(c) : live.add(c);
    if (changed) {
      if (c === 'archive') setBundles(snap.docs.map(d => ({ ...d.data(), id: d.id })));
      else if (LIVE[c]) { LIVE[c] = new Map(snap.docs.map(d => [d.id, d.data()])); compose(c); }
      else S[c] = new Map(snap.docs.map(d => [d.id, d.data()]));
    }
    if (live.size === cols.length) { clearTimeout(timer); begin(); }
    if (begun) status();
    if (changed) refresh();
  }, e => {
    clearTimeout(timer); if (denied) return;
    if (e.code === 'permission-denied') { denied = true;
      ssSet('fb_note', `<b>${esc(acctName(user.email))}</b> cannot sign in. The user is inactive or not set up. Ask a General Manager.`);
      firebase.auth().signOut(); }
    else { setMode('error'); toast(`Lost the connection to Firebase (${esc(e.code || '')}). Reload the page.`, 1); }
  });
}
async function boot() {
  showAuth('loading');
  const h = location.hash.slice(1); go(TABS[h] ? h : 'dash');
  let db = null;
  try { if (window.claude && typeof claude.use === 'function') db = await claude.use('db'); } catch {}
  if (!db && FB_ON) return bootFirebase();
  if (!db) { loadLocal(); setMode('local'); await migrateBranches(); startAuth(); return; }
  DB = db; setMode('connecting');
  const ready = new Set(), cols = Object.keys(S);
  const timer = setTimeout(() => { if (ready.size < cols.length) setMode('slow'); }, 10000);
  for (const c of cols) {
    db.collection(c).onSnapshot(snap => {
      S[c] = new Map(snap.docs.map(d => [d.id, d.data()]));
      if (!snap.metadata.fromCache) { ready.add(c); if (ready.size === cols.length) { clearTimeout(timer); if (!readOnly) { setMode('online'); } migrateBranches(); startAuth(); } }
      refresh();
    }, e => { clearTimeout(timer); setMode(e.code === 'revoked' ? 'readonly' : 'error'); });
  }
}
boot();
</script>
